<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <style>
    :root{
      --bg:#f3f4f6;
      --card:#ffffff;
      --accent:#2563eb;
      --muted:#6b7280;
      --danger:#dc2626;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
      padding:24px;
    }
    .card{
      width:100%; max-width:420px;
      background:var(--card);
      border-radius:12px;
      box-shadow:0 8px 30px rgba(16,24,40,0.08);
      padding:28px;
    }
    h1{margin:0 0 8px; font-size:20px}
    p.lead{margin:0 0 20px; color:var(--muted); font-size:14px}
    label{display:block; font-size:13px; margin-bottom:6px; color:#111827}
    .input{
      width:100%; padding:10px 12px; border-radius:8px; border:1px solid #e6e7ea;
      font-size:14px; outline:none; transition:box-shadow .12s, border-color .12s;
      background:#fff;
    }
    .input:focus{box-shadow:0 0 0 4px rgba(37,99,235,0.08); border-color:var(--accent)}
    .field{margin-bottom:14px}
    .row{display:flex; gap:12px; align-items:center}
    .checkbox{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
    .actions{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:8px}
    .btn{
      padding:10px 14px; border-radius:8px; border:0; cursor:pointer; font-weight:600;
      background:var(--accent); color:white;
    }
    .btn.secondary{background:transparent; color:var(--accent); border:1px solid rgba(37,99,235,0.16)}
    .forgot{font-size:13px; color:var(--muted); text-decoration:none}
    .error{color:var(--danger); font-size:13px; margin-top:6px}
    .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
    .helper{font-size:12px; color:var(--muted); margin-top:6px}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="login-heading">
    <h1 id="login-heading">Sign in to your account</h1>
    <p class="lead">Enter your email and password to continue.</p>

    <form id="loginForm" action="/login" method="post" novalidate>
      <!-- If you have CSRF tokens, include them here (server-side rendered) -->
      <!-- <input type="hidden" name="csrf_token" value="{{csrf_token}}"> -->

      <div class="field">
        <label for="email">Email</label>
        <input id="email" class="input" name="email" type="email"
               inputmode="email" autocomplete="email" required
               placeholder="you@example.com"
               aria-describedby="emailHelp emailError">
        <div id="emailHelp" class="helper">We'll never share your email.</div>
        <div id="emailError" class="error" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="row" style="align-items:center">
          <input id="password" class="input" name="password" type="password"
                 autocomplete="current-password" required minlength="6"
                 placeholder="Your password"
                 aria-describedby="passwordError">
          <button type="button" id="togglePassword" class="btn secondary" aria-pressed="false"
                  title="Show password" style="padding:8px 10px; font-weight:500">
            Show
          </button>
        </div>
        <div id="passwordError" class="error" aria-live="polite"></div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px">
        <label class="checkbox">
          <input type="checkbox" name="remember" id="remember">
          <span>Remember me</span>
        </label>
        <a class="forgot" href="/forgot-password">Forgot password?</a>
      </div>

      <div class="actions">
        <button id="submitBtn" type="submit" class="btn">Sign in</button>
        <button type="button" id="demoBtn" class="btn secondary">Demo account</button>
      </div>
    </form>
  </main>

  <script>
    (function(){
      const form = document.getElementById('loginForm');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');
      const toggle = document.getElementById('togglePassword');
      const demoBtn = document.getElementById('demoBtn');

      // Show / hide password
      toggle.addEventListener('click', () => {
        const isHidden = password.type === 'password';
        password.type = isHidden ? 'text' : 'password';
        toggle.textContent = isHidden ? 'Hide' : 'Show';
        toggle.setAttribute('aria-pressed', String(isHidden));
      });

      // Basic live validation messages
      function validateEmail(){
        emailError.textContent = '';
        if (!email.checkValidity()) {
          if (email.validity.valueMissing) emailError.textContent = 'Email is required.';
          else if (email.validity.typeMismatch) emailError.textContent = 'Please enter a valid email address.';
          return false;
        }
        return true;
      }

      function validatePassword(){
        passwordError.textContent = '';
        if (!password.checkValidity()){
          if (password.validity.valueMissing) passwordError.textContent = 'Password is required.';
          else if (password.validity.tooShort) passwordError.textContent = 'Password must be at least 6 characters.';
          return false;
        }
        return true;
      }

      email.addEventListener('input', validateEmail);
      password.addEventListener('input', validatePassword);

      // Demo button fills sample credentials (for testing)
      demoBtn.addEventListener('click', () => {
        email.value = 'demo@example.com';
        password.value = 'password123';
      });

      // Handle submit: prevent default if invalid, otherwise show how to POST
      form.addEventListener('submit', function(e){
        e.preventDefault();
        const okEmail = validateEmail();
        const okPass = validatePassword();
        if(!okEmail || !okPass) return;

        // Option A: Submit the form normally (uncomment next line)
        // form.submit();

        // Option B: Send credentials via fetch (example, adapt to your backend)
        const payload = {
          email: email.value.trim(),
          password: password.value,
          remember: document.getElementById('remember').checked
        };

        // Example fetch - adapt the URL and headers for your API
        fetch(form.action, {
          method: form.method || 'POST',
          headers: {
            'Content-Type': 'application/json'
            // include CSRF header if required by your backend
          },
          body: JSON.stringify(payload)
        })
        .then(async res => {
          if (!res.ok) {
            // try to parse server errors
            const text = await res.text().catch(()=>null);
            throw new Error(text || ('HTTP ' + res.status));
          }
          return res.json();
        })
        .then(data => {
          // handle success (example)
          // if your API returns a redirect URL:
          if (data.redirect) {
            window.location.href = data.redirect;
            return;
          }
          alert('Login successful — adapt this to your flow.');
        })
        .catch(err => {
          // Replace with nicer UI for real app
          passwordError.textContent = 'Sign-in failed. Check your details.';
          console.error('Login error:', err);
        });
      });
    })();
  </script>
</body>
</html>
